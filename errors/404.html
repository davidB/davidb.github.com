<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — David Bernard</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --fg-muted: #595959;
        --bg: #ffffff;
        --accent: #2a6df4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8e8e8;
          --fg-muted: #a3a3a3;
          --bg: #111214;
          --accent: #6ea8fe;
        }
      }
      body {
        max-width: 34rem;
        margin: 4rem auto;
        padding: 0 1.25rem;
        font-family: system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
        line-height: 1.6;
      }
      p { color: var(--fg-muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>This page doesn't exist. <a href="/">Back to the homepage</a>.</p>
  </body>
</html>
